<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">EverestKit logo</title>
  <desc id="desc">Green mountain emblem above the EverestKit wordmark.</desc>
  <defs>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25d67b"/>
      <stop offset="1" stop-color="#08a96a"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- Mountain emblem -->
  <g fill="url(#mountain)" stroke="none">
    <path d="M105 355 L195 285 L245 315 L425 130 L610 285 L700 210 L815 355 L695 335 L610 292 L540 350 L425 205 L340 310 L245 345 L195 325 Z"/>
    <path d="M425 130 L470 182 L442 176 L425 205 L395 185 Z" fill="#0b9f67"/>
    <path d="M195 285 L245 315 L220 323 L195 325 L170 315 Z" fill="#18bd70"/>
    <path d="M700 210 L815 355 L750 335 L700 280 L665 305 Z" fill="#12b86c"/>
  </g>

  <!-- Snow accents -->
  <g fill="#dff8e9">
    <path d="M425 130 L395 185 L425 169 L442 176 L470 182 Z"/>
    <path d="M610 285 L575 255 L590 290 L570 278 L540 350 L610 292 Z"/>
    <path d="M700 210 L665 305 L700 280 L716 294 L750 335 Z"/>
  </g>

  <!-- Sweeping base stroke -->
  <path d="M90 380 C245 330 365 350 505 375 C650 402 735 390 820 350 C755 430 620 438 470 405 C315 372 195 365 90 380 Z" fill="url(#mountain)"/>

  <!-- Wordmark -->
  <text x="450" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="900" letter-spacing="-5" fill="url(#text)">EVERESTKIT</text>
</svg>
